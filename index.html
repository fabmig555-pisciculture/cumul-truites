<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><title>Cumul Truites</title>
<style>
body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
main{max-width:720px;margin:auto;padding:18px 16px 40px}h1{margin:5px 0}.muted{color:#9ba4b2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#151922;border:1px solid #2a303b;border-radius:18px;padding:15px}.wide{grid-column:1/-1}
.value{font-size:27px;font-weight:750;margin-top:5px}label{font-size:13px;color:#9ba4b2}
input{width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border-radius:12px;border:1px solid #2a303b;background:#11151b;color:white;font-size:18px}
button{width:100%;padding:15px;border:0;border-radius:15px;background:#2f9cff;color:white;font-size:17px;font-weight:700;margin-top:12px}
.secondary{background:#252b35}.danger{background:#3a2025;color:#ffb8bf}
#scanner{display:none;position:relative;margin-top:14px;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:1}
video{width:100%;height:100%;object-fit:cover}.reticle{position:absolute;left:10%;right:10%;top:35%;height:30%;border:3px solid white;border-radius:14px}
#status{text-align:center;min-height:24px;margin:12px 0;color:#9ba4b2}.last{margin-top:10px}.last strong{font-size:24px}
table{width:100%;margin-top:15px;border-collapse:collapse;background:#151922}td,th{padding:9px;border-bottom:1px solid #2a303b;text-align:left}td:last-child,th:last-child{text-align:right}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px;line-height:1.4;color:#9ba4b2;margin-top:12px}
</style></head>
<body><main>
<h1>Cumul Truites</h1><p class="muted">Scan caméra • poids • nombre • prix</p>
<div class="grid">
<div class="card"><label>Poids cumulé</label><div id="total" class="value">0,000 kg</div></div>
<div class="card"><label>Nombre de pavés</label><div id="count" class="value">0</div></div>
<div class="card wide"><label>Prix TTC / kg</label><input id="price" type="number" step="0.01" min="0" value="12.60"></div>
<div class="card wide"><label>Montant total TTC</label><div id="amount" class="value">0,00 €</div></div>
</div>
<button id="start">Scanner les pavés</button><button id="stop" class="secondary" style="display:none">Arrêter le scan</button>
<div id="scanner"><video id="video" playsinline muted></video><div class="reticle"></div></div>
<div id="status">Prêt.</div>
<div class="card last"><label>Dernier scan</label><br><strong id="last">—</strong><div id="code" class="muted"></div></div>
<div class="row"><button id="undo" class="secondary">Annuler le dernier</button><button id="reset" class="danger">Nouvelle livraison</button></div>
<table id="history" style="display:none"><thead><tr><th>#</th><th>Article</th><th>Poids</th></tr></thead><tbody></tbody></table>
<p class="small">Format balance : 2 + 6 chiffres article + 5 chiffres de poids en grammes + clé EAN-13. Exemple 2106680003107 = 310 g. Prix modifiable.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>
<script>
const $=x=>document.getElementById(x);let items=[],reader=null,controls=null,last=0;
function decode(s){s=String(s).replace(/\D/g,'');if(s.length!==13||s[0]!=='2')throw Error("Code non reconnu");
let sum=0;for(let i=0;i<12;i++)sum+=+s[i]*(i%2?3:1);if((10-sum%10)%10!==+s[12])throw Error("Clé EAN invalide");
let article=s.slice(1,7),g=+s.slice(7,12);if(!g)throw Error("Poids invalide");
return{code:s,article,name:article==='106680'?'Pavé de truite X2':'Article '+article,grams:g}}
function render(){let g=items.reduce((a,x)=>a+x.grams,0),p=+($('price').value||0);$('total').textContent=(g/1000).toLocaleString('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:3})+' kg';$('count').textContent=items.length;$('amount').textContent=(g/1000*p).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});$('history').style.display=items.length?'':'none';$('history').querySelector('tbody').innerHTML=items.map((x,i)=>`<tr><td>${i+1}</td><td>${x.name}</td><td>${x.grams} g</td></tr>`).join('')}
async function start(){try{if(!window.ZXingBrowser)throw Error("Lecteur indisponible : connexion Internet nécessaire.");
$('scanner').style.display='block';$('start').style.display='none';$('stop').style.display='';$('status').textContent='Présente le code-barres dans le cadre…';
reader=new ZXingBrowser.BrowserMultiFormatReader();controls=await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}},audio:false},$('video'),(r,e)=>{if(!r||Date.now()-last<1200)return;last=Date.now();try{let x=decode(r.getText());items.push(x);$('last').textContent=x.grams+' g';$('code').textContent=x.code+' • '+x.name;$('status').textContent='Scan enregistré. Présente le suivant…';render()}catch(e){$('status').textContent=e.message}})}catch(e){$('status').textContent=e.message;stop()}}
function stop(){if(controls?.stop)controls.stop();controls=null;reader=null;$('scanner').style.display='none';$('start').style.display='';$('stop').style.display='none'}
$('start').onclick=start;$('stop').onclick=stop;$('price').oninput=render;$('undo').onclick=()=>{items.pop();render()};$('reset').onclick=()=>{if(confirm('Effacer cette livraison ?')){items=[];render();$('last').textContent='—';$('code').textContent=''}};render();
</script></body></html>
